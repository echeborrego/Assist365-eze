# Local Airflow with UI for developing and demoing the DAG: docker compose up, then http://localhost:8080
# (user "admin", password: docker compose exec airflow cat /opt/airflow/standalone_admin_password.txt).
# Uses your gcloud application-default credentials; production runs on Cloud Run (deploy/deploy.sh).
services:
  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcloud/application_default_credentials.json
      _PIP_ADDITIONAL_REQUIREMENTS: "google-cloud-bigquery==3.27.0 python-dotenv==1.0.1"
    volumes:
      - ./dags:/opt/airflow/dags
      - ${HOME}/.config/gcloud/application_default_credentials.json:/opt/airflow/gcloud/application_default_credentials.json:ro
